[project]
name = "tutupbuku"
version = "0.1.0"
description = "TutupBuku local review engine and hosted records API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.117.1",
    "psycopg[binary]==3.3.6",
    "pypdf==5.4.0",
    "Pillow==11.1.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tutupbuku"]

[tool.vercel]
entrypoint = "tutupbuku.api:app"

[tool.uv]
package = true

[tool.unittest]
start-directory = "tests"
